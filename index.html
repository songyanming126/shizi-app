<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍎 识字小课堂 · 趣味互动版</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    background: linear-gradient(145deg, #fdf8e7 0%, #fef3d4 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 10px; user-select: none;
}
.app-container {
    max-width: 540px; width: 100%; background: #ffffffd9;
    border-radius: 56px 56px 44px 44px;
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.25);
    padding: 16px 12px 20px; border: 2px solid #fff8e7;
}
.top-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; margin-bottom: 8px; gap: 5px; flex-wrap: wrap; }
.level-badge { background: #d9b8ff; padding: 5px 10px; border-radius: 40px; font-weight: 700; font-size: 0.82rem; color: #3d1e6b; box-shadow: 0 4px 0 #a07fd6; }
.progress-badge { background: #ffd966; padding: 5px 10px; border-radius: 40px; font-weight: 700; font-size: 0.78rem; color: #6b4a0e; box-shadow: 0 4px 0 #dbaa2b; }
.star-counter { background: #ffb347; padding: 5px 10px; border-radius: 40px; font-weight: 700; font-size: 0.82rem; color: #4a2e00; box-shadow: 0 4px 0 #c47e1a; }
.level-selector { display: flex; gap: 4px; justify-content: center; margin: 4px 0 8px; flex-wrap: wrap; }
.level-chip { padding: 5px 8px; border-radius: 30px; background: #f0e7d8; border: 2px solid #d9c9ae; font-weight: 700; color: #6b5a42; cursor: pointer; font-size: 0.7rem; box-shadow: 0 3px 0 #c4b296; white-space: nowrap; }
.level-chip.active { background: #ffd966; border-color: #dbaa2b; color: #4a2e0e; box-shadow: 0 3px 0 #b18b29; }
.level-chip:active { transform: translateY(2px); box-shadow: 0 1px 0 #c4b296; }

.character-card {
    background: #fffef7; border-radius: 36px; padding: 14px 8px 10px; margin-bottom: 8px;
    box-shadow: inset 0 -6px 0 #e8dcc0, inset 0 6px 10px #fff9e6, 0 14px 20px -12px rgba(0,0,0,0.3);
    border: 2px solid #f9eec1; text-align: center; cursor: pointer;
}
.big-hanzi { font-size: 5.8rem; line-height: 1.1; font-weight: 900; color: #3d2b1a; text-shadow: 4px 4px 0 #ffd58c; letter-spacing: 4px; }
.pinyin { font-size: 1.4rem; font-weight: 600; color: #b05d1e; background: #ffeed9; display: inline-block; padding: 3px 20px; border-radius: 50px; margin: 3px 0 2px; box-shadow: 0 3px 0 #dbbd95; }
.meaning { font-size: 1rem; color: #6b4f2b; background: #fbf3e2; display: inline-block; padding: 3px 18px; border-radius: 40px; margin-top: 2px; }
.word-example { font-size: 0.95rem; color: #795d36; margin-top: 6px; background: #fff5e2; padding: 5px 14px; border-radius: 40px; display: inline-block; border: 1px dashed #dbbd91; }
.writing-requirement { background: #e8f0fe; border-radius: 22px; padding: 5px 12px; margin: 6px 2px 0; font-size: 0.78rem; color: #1a4d80; display: flex; align-items: center; justify-content: center; gap: 5px; border: 1px dashed #aac9f0; }
.actions { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin: 8px 0 4px; }
.action-btn { flex: 1 0 92px; border: none; border-radius: 50px; padding: 11px 4px; font-size: 0.92rem; font-weight: 700; color: #4a2e0e; background: #ffe9a7; box-shadow: 0 6px 0 #dbb13b; display: flex; align-items: center; justify-content: center; gap: 3px; cursor: pointer; border: 1px solid #fff5d5; }
.action-btn:active { box-shadow: 0 2px 0 #dbb13b; transform: translateY(4px); }
.play-btn { background: #b5e3b5; box-shadow: 0 6px 0 #6da06d; color: #214d21; }
.game-btn { background: #ffb8b8; box-shadow: 0 6px 0 #c95f5f; color: #5e1a1a; }
.next-btn { background: #aad4ff; box-shadow: 0 6px 0 #5f8fca; color: #113355; }
.hint { text-align: center; margin-top: 10px; font-size: 0.82rem; color: #b99e7a; background: #fcf6e9; padding: 6px 12px; border-radius: 32px; border: 1px solid #efe0c9; }
@keyframes pop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
.pop { animation: pop 0.3s ease-in-out; }
@keyframes flyStar { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-120px) scale(1.8)} }
.star-fly { position: fixed; pointer-events: none; font-size: 2rem; animation: flyStar 0.8s ease-out forwards; z-index: 999; }

/* 游戏弹窗 */
.game-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 10px; visibility: hidden; opacity: 0; transition: opacity 0.2s, visibility 0.2s; }
.game-overlay.active { visibility: visible; opacity: 1; }
.game-modal { background: #fffef7; max-width: 480px; width: 100%; border-radius: 36px; padding: 16px 14px 20px; box-shadow: 0 30px 50px rgba(0,0,0,0.3); border: 3px solid #fff0c0; text-align: center; transform: scale(0.9); transition: transform 0.2s; max-height: 92vh; overflow-y: auto; }
.game-overlay.active .game-modal { transform: scale(1); }
.game-title { font-size: 1.35rem; font-weight: 800; color: #4a2e0e; margin-bottom: 2px; }
.game-subtitle { font-size: 0.85rem; color: #8b6f4a; margin-bottom: 10px; }
.game-content { margin: 8px 0 12px; }
.game-result { font-size: 1rem; font-weight: 700; color: #2e7d32; margin: 6px 0; min-height: 1.5rem; }
.game-close-btn { margin-top: 8px; background: #d9d9d9; border: none; border-radius: 40px; padding: 9px 32px; font-size: 1rem; font-weight: 700; color: #4a4a4a; box-shadow: 0 4px 0 #a0a0a0; cursor: pointer; }
.game-close-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a0a0a0; }

/* ========== 游戏组件 ========== */
.mole-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.mole-hole { width: 100%; aspect-ratio: 1; background: #8B5E3C; border-radius: 50% 50% 40% 40%; position: relative; overflow: hidden; box-shadow: inset 0 6px 8px rgba(0,0,0,0.4); cursor: pointer; border: 3px solid #6B4226; }
.mole-hole::after { content: ''; position: absolute; bottom: 0; left: 10%; width: 80%; height: 30%; background: #5C3A1E; border-radius: 50%; }
.mole { position: absolute; bottom: -100%; left: 10%; width: 80%; height: 80%; background: #f5d6a0; border-radius: 50% 50% 40% 40%; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 900; color: #3d2b1a; transition: bottom 0.2s ease-out; cursor: pointer; border: 2px solid #d4a96a; }
.mole.up { bottom: 5%; }
.mole.correct { background: #b5e3b5; border-color: #4ca64c; }
.mole.wrong { background: #ffb8b8; border-color: #cc5555; animation: shake 0.3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

.memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
.memory-card { aspect-ratio: 1; border-radius: 14px; background: linear-gradient(145deg, #aad4ff, #7ab8f0); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900; color: #fff; cursor: pointer; box-shadow: 0 4px 0 #5f8fca; transition: all 0.25s; position: relative; transform-style: preserve-3d; border: 2px solid #8ec0f0; }
.memory-card.flipped { background: #fff2d6; color: #3d2b1a; border-color: #ffd966; box-shadow: 0 4px 0 #dbaa2b; transform: rotateY(180deg); }
.memory-card.matched { background: #b5e3b5; border-color: #4ca64c; box-shadow: 0 4px 0 #4ca64c; pointer-events: none; opacity: 0.7; }
.memory-card .front { position: absolute; backface-visibility: hidden; font-size: 1.6rem; }
.memory-card .back { position: absolute; backface-visibility: hidden; transform: rotateY(180deg); }

.match3-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
.match3-item { aspect-ratio: 1; border-radius: 14px; background: #fff2d6; border: 2px solid #ffd966; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 900; color: #3d2b1a; cursor: pointer; box-shadow: 0 4px 0 #dbaa2b; transition: all 0.15s; }
.match3-item:active { transform: scale(0.95); }
.match3-item.selected { background: #ffe69b; border-color: #e6a817; box-shadow: 0 4px 0 #b88a1a; transform: scale(0.92); }
.match3-item.removed { opacity: 0; pointer-events: none; transform: scale(0); }
.match3-item.wrong { animation: shake 0.3s; }

.drag-area { display: flex; justify-content: center; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
.drag-slot { width: 64px; height: 64px; border-radius: 18px; background: #f5f5f5; border: 3px dashed #ccc; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 900; color: #3d2b1a; transition: all 0.15s; }
.drag-slot.hover { background: #ffe9a7; border-color: #dbb13b; transform: scale(1.05); }
.drag-slot.filled { background: #b5e3b5; border: 3px solid #4ca64c; }
.drag-pieces { display: flex; justify-content: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
.drag-piece { width: 56px; height: 56px; border-radius: 16px; background: #fff2d6; border: 2px solid #ffd966; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; font-weight: 900; color: #3d2b1a; cursor: grab; box-shadow: 0 4px 0 #dbaa2b; transition: all 0.1s; }
.drag-piece:active { cursor: grabbing; transform: translateY(3px); box-shadow: 0 1px 0 #dbaa2b; }
.drag-piece.dragging { opacity: 0.5; }
.drag-piece.used { opacity: 0.2; pointer-events: none; }

.listen-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin: 16px 0; }
.listen-item { width: 80px; height: 80px; border-radius: 50%; background: #e8f0fe; border: 3px solid #aac9f0; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 900; color: #1a4d80; cursor: pointer; box-shadow: 0 5px 0 #7fa8d9; transition: all 0.1s; }
.listen-item:active { transform: translateY(4px); box-shadow: 0 1px 0 #7fa8d9; }
.listen-item.correct { background: #b5e3b5; border-color: #4ca64c; box-shadow: 0 5px 0 #4ca64c; }
.listen-item.wrong { background: #ffb8b8; border-color: #cc5555; box-shadow: 0 5px 0 #cc5555; animation: shake 0.3s; }

.speaker-btn { width: 70px; height: 70px; border-radius: 50%; background: #ffe9a7; display: flex; align-items: center; justify-content: center; font-size: 2.6rem; margin: 8px auto; cursor: pointer; box-shadow: 0 5px 0 #dbb13b; border: none; }
.speaker-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #dbb13b; }

.timer-bar { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin: 8px 0; }
.timer-fill { height: 100%; background: linear-gradient(90deg, #66bb6a, #ffa726, #ef5350); border-radius: 5px; transition: width 0.1s linear; }

@media (max-width: 400px) {
    .big-hanzi { font-size: 4.6rem; }
    .action-btn { font-size: 0.8rem; padding: 9px 2px; flex: 1 0 72px; }
    .mole { font-size: 1.5rem; }
    .memory-card { font-size: 1.4rem; }
    .match3-item { font-size: 1.3rem; }
    .listen-item { width: 64px; height: 64px; font-size: 1.8rem; }
    .level-chip { font-size: 0.65rem; padding: 4px 6px; }
}
</style>
</head>
<body>

<div class="app-container">
    <div class="top-bar">
        <div class="level-badge" id="levelBadge">🧸 <span id="levelLabel">学前启蒙</span></div>
        <div class="progress-badge">📚 <span id="currentIndexDisplay">1</span>/<span id="totalCountDisplay">100</span></div>
        <div class="star-counter">⭐ <span id="starCountDisplay">0</span></div>

    <div class="level-selector" id="levelSelector">

        <button class="action-btn game-btn" id="gameBtn">🎮 玩一玩</button>
        <button class="action-btn next-btn" id="nextBtn">➡️ 下一个</button>
    </div>

    <div class="hint" id="hintMessage">✨ 点击“玩一玩”，体验趣味互动游戏</div>
</div>

<div class="game-overlay" id="gameOverlay">
    <div class="game-modal">

        <div class="game-content" id="gameContent"></div>
        <div class="game-result" id="gameResult"></div>
        <button class="game-close-btn" id="closeGameBtn">关闭</button>
    </div>
</div>

    // 从示例字段提取纯中文词语，如 "👨 大人 · 人们" → "大人，人们"
    function extractWords(example) {
        if (!example) return '';
        // 去掉emoji和符号，保留中文和间隔点
        var cleaned = example.replace(/[^\u4e00-\u9fa5·]/g, '').trim();
        // 把 · 换成逗号，作为停顿
        cleaned = cleaned.replace(/·/g, '，');
        // 去掉首尾可能多余的空格
        return cleaned;
    }

    function speakHanziWithWords(hanzi, example) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        var words = extractWords(example);
        var text = words ? hanzi + '，' + words : hanzi;
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        u.rate = 0.8;   // 稍慢一点，方便小朋友听清

    function shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; } return b; }

    function makeDistractors(correct, n) {
        var pool=[]; for(var i=0;i<filteredList.length;i++){ if(filteredList[i].hanzi!==correct) pool.push(filteredList[i].hanzi); }
        if(pool.length<n){ for(var j=0;j<ALL_CHARS.length;j++){ if(ALL_CHARS[j].hanzi!==correct && pool.indexOf(ALL_CHARS[j].hanzi)===-1) pool.push(ALL_CHARS[j].hanzi); } }
        return shuffle(pool).slice(0,n);
    }

    function getWritingReq(level, strokes) {
        if(level===1) return '认识字形，能口头组词';
        if(level===2) return '按笔顺书空，说出笔画（'+strokes+'画）';
        if(level===3) return '独立书写，注意结构比例（'+strokes+'画）';
        return '书写美观，间架匀称（'+strokes+'画）';
    }

    // ==================== 渲染 ====================
    function updateLevelBadge(){ var i=LEVEL_INFO[currentLevel]; levelBadgeEl.innerHTML=i.icon+' <span id="levelLabel">'+i.name+'</span>'; levelLabelEl=document.getElementById('levelLabel'); }
    function updateLevelChips(){ var cs=document.querySelectorAll('.level-chip'); for(var i=0;i<cs.length;i++){ cs[i].classList.toggle('active', parseInt(cs[i].getAttribute('data-level'),10)===currentLevel); } }

    function renderCharacter() {
        var c=getCurrentChar(); if(!c) return;
        bigHanziEl.textContent=c.hanzi; pinyinEl.textContent=c.pinyin; meaningEl.textContent=c.meaning; wordExampleEl.textContent=c.example;
        currentIndexDisplay.textContent=currentIndex+1; totalCountDisplay.textContent=filteredList.length; starCountDisplay.textContent=starTotal;
        writingReqText.textContent=getWritingReq(currentLevel,c.strokes);
    }

    function switchLevel(lv) {
        currentLevel=lv; filteredList=ALL_CHARS.filter(function(c){ return c.level===lv; });
        currentIndex=0; gameCounter=0;
        updateLevelBadge(); updateLevelChips(); renderCharacter();
        setHint('已切换到 '+LEVEL_INFO[lv].name+'，共 '+filteredList.length+' 个字');
    }

    // ==================== 按钮 ====================
    // 听一听：汉字 + 常用组词连读
    function handlePlaySound(){
        var c = getCurrentChar();
        speakHanziWithWords(c.hanzi, c.example);
        var k = getCharKey('sound');
        if(!soundPlayedSet[k]){
            soundPlayedSet[k] = true;
            addStar(1, playSoundBtn);
            setHint('🔊 你听到了“' + c.hanzi + '”和它的组词，获得1颗星星！');
        } else {
            setHint('🔊 再听一次“' + c.hanzi + '”和组词，真棒！');
        }
    }

    function handleLearn(){ var c=getCurrentChar(); speakText(c.hanzi); var k=getCharKey('learn'); if(!learnedSet[k]){ learnedSet[k]=true; addStar(2,learnBtn); setHint('📖 “'+c.hanzi+'” '+c.pinyin+' —— '+c.example+' 获得2颗星星！'); } else { setHint('📚 你已经学过“'+c.hanzi+'”啦，再复习一次吧！'); } }
    function handleNext(){ if(!filteredList.length) return; currentIndex=(currentIndex+1)%filteredList.length; gameCounter=0; renderCharacter(); setHint('当前 '+LEVEL_INFO[currentLevel].name+'，点击“玩一玩”挑战吧'); }

    // ==================== 游戏系统：每级两套轮换 ====================
    function openGame() {
        gameResult.textContent=''; gameContent.innerHTML='';
        var c=getCurrentChar();
        var gameType;
        if(currentLevel===1) gameType = gameCounter%2===0 ? 'mole' : 'memory';
        else if(currentLevel===2) gameType = gameCounter%2===0 ? 'memory' : 'match3';
        else if(currentLevel===3) gameType = gameCounter%2===0 ? 'match3' : 'drag';
        else gameType = gameCounter%2===0 ? 'drag' : 'listen';
        gameCounter++;

        if(gameType==='mole') buildMoleGame(c);
        else if(gameType==='memory') buildMemoryGame(c);
        else if(gameType==='match3') buildMatch3Game(c);
        else if(gameType==='drag') buildDragGame(c);
        else if(gameType==='listen') buildListenGame(c);

        gameOverlay.classList.add('active');
    }
    function closeGame(){ gameOverlay.classList.remove('active'); gameResult.textContent=''; }
    function disableAll(container){ var es=container.querySelectorAll('*'); for(var i=0;i<es.length;i++){ es[i].style.pointerEvents='none'; } }

    // ---------- 游戏1：打地鼠 ----------
    function buildMoleGame(c) {
        gameTitle.textContent='🔨 汉字打地鼠';
        gameSubtitle.textContent='敲击正确的汉字“'+c.hanzi+'”';
        var correct=c.hanzi;
        var grid=document.createElement('div'); grid.className='mole-grid';
        var holes=[];
        var score=0, targetScore=3;
        var timer=null;

        for(var i=0;i<9;i++){
            var hole=document.createElement('div'); hole.className='mole-hole';
            var mole=document.createElement('div'); mole.className='mole';
            hole.appendChild(mole); grid.appendChild(hole); holes.push({hole:hole,mole:mole});
        }
        gameContent.appendChild(grid);

        var scoreDiv=document.createElement('div'); scoreDiv.style.cssText='font-size:1rem;color:#6b4f2b;font-weight:700;margin:6px 0;'; scoreDiv.textContent='得分：0/'+targetScore; gameContent.appendChild(scoreDiv);

        function popMole() {
            for(var i=0;i<holes.length;i++){ holes[i].mole.classList.remove('up','correct','wrong'); }
            var idx=Math.floor(Math.random()*holes.length);
            var isCorrect=Math.random()<0.5;
            var char=isCorrect?correct:makeDistractors(correct,1)[0];
            var m=holes[idx].mole;
            m.textContent=char;
            m.dataset.isCorrect=isCorrect?'1':'0';
            m.classList.add('up');
        }

        function onMoleClick(e) {
            var m=e.currentTarget;
            if(!m.classList.contains('up')) return;
            if(m.dataset.isCorrect==='1'){
                m.classList.add('correct');
                score++; scoreDiv.textContent='得分：'+score+'/'+targetScore;
                speakText(correct);
                if(score>=targetScore){
                    clearInterval(timer);
                    gameResult.textContent='🎉 打地鼠成功！获得3颗星星！';
                    var k=getCharKey('mole'); if(!gameWinSet[k]){ gameWinSet[k]=true; addStar(3,gameBtn); }
                    disableAll(grid);
                }
            } else {
                m.classList.add('wrong');
            }
        }

        for(var j=0;j<holes.length;j++){ holes[j].mole.addEventListener('click',onMoleClick); }
        timer=setInterval(popMole,800);
        popMole();
        gameOverlay.dataset.timer=timer;

        var tip=document.createElement('div'); tip.style.cssText='font-size:0.8rem;color:#b99e7a;margin-top:6px;'; tip.textContent='敲击显示正确汉字的“地鼠”'; gameContent.appendChild(tip);
    }

    // ---------- 游戏2：记忆翻牌 ----------
    function buildMemoryGame(c) {
        gameTitle.textContent='🃏 记忆翻牌';
        gameSubtitle.textContent='找出所有配对（汉字+拼音）';
        var correct=c.hanzi, correctPinyin=c.pinyin;
        var others=makeDistractors(correct,2);
        var pairs=[{h:correct,p:correctPinyin}];
        for(var i=0;i<others.length;i++){
            var oh=others[i], op='—';
            for(var k=0;k<ALL_CHARS.length;k++){ if(ALL_CHARS[k].hanzi===oh){ op=ALL_CHARS[k].pinyin; break; } }
            pairs.push({h:oh,p:op});
        }
        var cards=[];
        for(var pi=0;pi<pairs.length;pi++){
            cards.push({type:'hanzi',value:pairs[pi].h,key:pi});
            cards.push({type:'pinyin',value:pairs[pi].p,key:pi});
        }
        cards=shuffle(cards);

        var grid=document.createElement('div'); grid.className='memory-grid';
        var flipped=[], matched=0, totalPairs=pairs.length, lock=false;

        for(var ci=0;ci<cards.length;ci++){
            (function(card){
                var el=document.createElement('div'); el.className='memory-card';
                el.innerHTML='<span class="front">❓</span><span class="back" style="display:none">'+card.value+'</span>';
                el.addEventListener('click',function(){
                    if(lock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
                    el.classList.add('flipped');
                    el.querySelector('.front').style.display='none';
                    el.querySelector('.back').style.display='block';
                    flipped.push({el:el,card:card});
                    if(flipped.length===2){
                        lock=true;
                        var a=flipped[0], b=flipped[1];
                        if(a.card.key===b.card.key && a.card.type!==b.card.type){
                            setTimeout(function(){
                                a.el.classList.add('matched'); b.el.classList.add('matched');
                                matched++; flipped=[]; lock=false;
                                gameResult.textContent='✅ 配对成功！';
                                if(matched===totalPairs){
                                    gameResult.textContent='🎉 全部配对成功！获得3颗星星！';
                                    var k=getCharKey('memory'); if(!gameWinSet[k]){ gameWinSet[k]=true; addStar(3,gameBtn); }
                                    speakText(correct);
                                }
                            },300);
                        } else {
                            setTimeout(function(){
                                a.el.classList.remove('flipped'); a.el.querySelector('.front').style.display='block'; a.el.querySelector('.back').style.display='none';
                                b.el.classList.remove('flipped'); b.el.querySelector('.front').style.display='block'; b.el.querySelector('.back').style.display='none';
                                flipped=[]; lock=false;
                                gameResult.textContent='❌ 不匹配，再试试';
                            },600);
                        }
                    }
                });
                grid.appendChild(el);
            })(cards[ci]);
        }
        gameContent.appendChild(grid);
        var tip=document.createElement('div'); tip.style.cssText='font-size:0.8rem;color:#b99e7a;margin-top:6px;'; tip.textContent='翻开卡片，把汉字和它的拼音配对'; gameContent.appendChild(tip);
    }

    // ---------- 游戏3：汉字消消乐 ----------
    function buildMatch3Game(c) {
        gameTitle.textContent='💥 汉字消消乐';
        gameSubtitle.textContent='点击两个相同的汉字消除';
        var correct=c.hanzi;
        var types=[correct].concat(makeDistractors(correct,3));
        var items=[];
        for(var i=0;i<4;i++){ for(var j=0;j<4;j++){ items.push(types[j]); } }
        items=shuffle(items);

        var grid=document.createElement('div'); grid.className='match3-grid';
        var selected=null, removedCount=0, total=16;

        for(var k=0;k<items.length;k++){
            (function(char){
                var el=document.createElement('div'); el.className='match3-item'; el.textContent=char;
                el.addEventListener('click',function(){
                    if(el.classList.contains('removed')) return;
                    if(selected===el){ el.classList.remove('selected'); selected=null; return; }
                    if(!selected){ selected=el; el.classList.add('selected'); return; }
                    if(selected.textContent===el.textContent){
                        selected.classList.add('removed'); el.classList.add('removed');
                        selected=null; removedCount+=2;
                        gameResult.textContent='✅ 消除成功！';
                        if(removedCount>=total){
                            gameResult.textContent='🎉 全部消除！获得3颗星星！';
                            var kk=getCharKey('match3'); if(!gameWinSet[kk]){ gameWinSet[kk]=true; addStar(3,gameBtn); }
                            speakText(correct);
                        }
                    } else {
                        var prev=selected; prev.classList.remove('selected');
                        el.classList.add('selected'); selected=el;
                        prev.classList.add('wrong'); setTimeout(function(){ prev.classList.remove('wrong'); },300);
                    }
                });
                grid.appendChild(el);
            })(items[k]);
        }
        gameContent.appendChild(grid);
        var tip=document.createElement('div'); tip.style.cssText='font-size:0.8rem;color:#b99e7a;margin-top:6px;'; tip.textContent='点击两个相同的汉字消除，注意“'+correct+'”是目标字'; gameContent.appendChild(tip);
    }

    // ---------- 游戏4：拖拽拼字 ----------
    function buildDragGame(c) {
        gameTitle.textContent='🧲 拖拽拼字';
        gameSubtitle.textContent='把部件拖到槽位拼成“'+c.hanzi+'”';
        var target=c.hanzi;
        var opts=shuffle([target].concat(makeDistractors(target,3)));

        var slotsDiv=document.createElement('div'); slotsDiv.className='drag-area';
        var slot=document.createElement('div'); slot.className='drag-slot'; slot.id='dragSlot'; slot.textContent='?';
        slotsDiv.appendChild(slot); gameContent.appendChild(slotsDiv);

        var piecesDiv=document.createElement('div'); piecesDiv.className='drag-pieces';
        var selectedPiece=null;

        for(var i=0;i<opts.length;i++){
            (function(ch){
                var p=document.createElement('div'); p.className='drag-piece'; p.textContent=ch; p.draggable=true;
                p.addEventListener('dragstart',function(e){ selectedPiece=p; p.classList.add('dragging'); e.dataTransfer.setData('text/plain', ch); });
                p.addEventListener('dragend',function(){ p.classList.remove('dragging'); });
                p.addEventListener('click',function(){ if(selectedPiece) selectedPiece.style.outline='none'; selectedPiece=p; p.style.outline='3px solid #dbb13b'; });
                piecesDiv.appendChild(p);
            })(opts[i]);
        }
        gameContent.appendChild(piecesDiv);

        slot.addEventListener('dragover',function(e){ e.preventDefault(); slot.classList.add('hover'); });
        slot.addEventListener('dragleave',function(){ slot.classList.remove('hover'); });
        slot.addEventListener('drop',function(e){
            e.preventDefault(); slot.classList.remove('hover');
            if(!selectedPiece) return;
            var ch=selectedPiece.textContent;
            if(ch===target){
                slot.textContent=target; slot.classList.add('filled'); selectedPiece.classList.add('used');
                gameResult.textContent='🎉 拼对了！获得3颗星星！';
                var k=getCharKey('drag'); if(!gameWinSet[k]){ gameWinSet[k]=true; addStar(3,gameBtn); }
                disableAll(piecesDiv); speakText(target);
            } else {
                gameResult.textContent='❌ 这个部件不对哦';
                selectedPiece.style.animation='shake 0.3s'; setTimeout(function(){ selectedPiece.style.animation=''; },400);
            }
        });
        slot.addEventListener('click',function(){
            if(!selectedPiece) return;
            var ch=selectedPiece.textContent;
            if(ch===target){
                slot.textContent=target; slot.classList.add('filled'); selectedPiece.classList.add('used');
                gameResult.textContent='🎉 拼对了！获得3颗星星！';
                var k=getCharKey('drag'); if(!gameWinSet[k]){ gameWinSet[k]=true; addStar(3,gameBtn); }
                disableAll(piecesDiv); speakText(target);
            } else {
                gameResult.textContent='❌ 这个部件不对哦';
                selectedPiece.style.animation='shake 0.3s'; setTimeout(function(){ selectedPiece.style.animation=''; },400);
            }
        });

        var tip=document.createElement('div'); tip.style.cssText='font-size:0.8rem;color:#b99e7a;margin-top:6px;'; tip.textContent='拖动部件到上方槽位，或先点击部件再点击槽位'; gameContent.appendChild(tip);
    }

    // ---------- 游戏5：听音点字 ----------
    function buildListenGame(c) {
        gameTitle.textContent='👂 听音点字';
        gameSubtitle.textContent='听发音，快速点出正确汉字';
        var correct=c.hanzi;

        var sp=document.createElement('button'); sp.className='speaker-btn'; sp.textContent='🔊';
        sp.addEventListener('click',function(){ speakText(correct); });
        gameContent.appendChild(sp);

        var timerBar=document.createElement('div'); timerBar.className='timer-bar';
        var timerFill=document.createElement('div'); timerFill.className='timer-fill'; timerFill.style.width='100%';
        timerBar.appendChild(timerFill); gameContent.appendChild(timerBar);

        var grid=document.createElement('div'); grid.className='listen-grid';
        var opts=shuffle([correct].concat(makeDistractors(correct,3)));
        var timeLeft=100, timerId=null, answered=false;

        for(var i=0;i<opts.length;i++){
            (function(ch){
                var el=document.createElement('div'); el.className='listen-item'; el.textContent=ch;
                el.addEventListener('click',function(){
                    if(answered) return;
                    if(ch===correct){
                        answered=true; clearInterval(timerId);
                        el.classList.add('correct');
                        gameResult.textContent='🎉 答对了！获得3颗星星！';
                        var k=getCharKey('listen'); if(!gameWinSet[k]){ gameWinSet[k]=true; addStar(3,gameBtn); }
                        disableAll(grid); speakText(correct);
                    } else {
                        el.classList.add('wrong'); gameResult.textContent='❌ 再听听～';
                        setTimeout(function(){ el.classList.remove('wrong'); },400);
                    }
                });
                grid.appendChild(el);
            })(opts[i]);
        }
        gameContent.appendChild(grid);

        timerId=setInterval(function(){
            timeLeft-=2;
            timerFill.style.width=timeLeft+'%';
            if(timeLeft<=0){
                clearInterval(timerId);
                if(!answered){ gameResult.textContent='⏰ 时间到！再试一次吧～'; disableAll(grid); }
            }
        },200);
        gameOverlay.dataset.timer=timerId;

        var tip=document.createElement('div'); tip.style.cssText='font-size:0.8rem;color:#b99e7a;margin-top:6px;'; tip.textContent='点击喇叭听发音，在时间结束前选出正确汉字'; gameContent.appendChild(tip);
    }

    function clearGameTimers(){
        if(gameOverlay.dataset.timer){ clearInterval(parseInt(gameOverlay.dataset.timer)); gameOverlay.dataset.timer=''; }
    }

    // ==================== 事件 ====================
    playSoundBtn.addEventListener('click',handlePlaySound);
    learnBtn.addEventListener('click',handleLearn);
    gameBtn.addEventListener('click',openGame);
    nextBtn.addEventListener('click',handleNext);
    closeGameBtn.addEventListener('click',function(){ clearGameTimers(); closeGame(); });
    gameOverlay.addEventListener('click',function(e){ if(e.target===gameOverlay){ clearGameTimers(); closeGame(); } });
    // 点击卡片也只读汉字+组词，保持一致性
    characterCard.addEventListener('click',function(){
        var c=getCurrentChar();
        speakHanziWithWords(c.hanzi, c.example);
        characterCard.classList.add('pop');
        setTimeout(function(){ characterCard.classList.remove('pop'); },200);
    });
    levelSelector.addEventListener('click',function(e){
        var t=e.target;
        while(t && t!==levelSelector){ if(t.classList && t.classList.contains('level-chip')){ var lv=parseInt(t.getAttribute('data-level'),10); if(lv!==currentLevel) switchLevel(lv); return; } t=t.parentNode; }
    });

    // ==================== 初始化 ====================
    if(window.speechSynthesis){ window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged=function(){}; }
    switchLevel(1);
    setHint('点击“听一听”会读汉字和组词，点“玩一玩”挑战游戏');

})();
</script>
